<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <!-- ?v= は更新したときに上げる（古いファイルがキャッシュで使われないように） -->
    <link rel="stylesheet" href="./style.css?v=7" />
  </head>
  <body hidden>
    <div id="container" class="container">
      <transition-group class="comments" name="comment" tag="div" @before-leave="pinLeaving">
        <div
          v-for="comment in visible"
          class="comment"
          :key="comment.data.id"
        >
          <div class="avatar" v-if="showIcon">
            <img alt="" v-if="comment.data.profileImage" :src="comment.data.profileImage" />
          </div>
          <div class="comment-body">
            <div class="comment-name" v-if="showName">{{ comment.data.displayName || comment.data.name }}</div>
            <div class="comment-text" v-html="comment.data.comment"></div>
          </div>
        </div>
      </transition-group>
    </div>
    <!-- わんコメ内ではわんコメ付属のVueとOneSDKを使う。設定ページのプレビュー（わんコメの外）ではCDNのVueに切り替え、ダミーコメントで動かす -->
    <script src="../__origin/js/vue3.min.js"></script>
    <script>
      window.Vue || document.write('<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"><\/script>')
    </script>
    <script src="../__origin/js/onesdk.js"></script>
    <script src="./config.js?v=6"></script>
    <script src="./script.js?v=7"></script>
  </body>
</html>
